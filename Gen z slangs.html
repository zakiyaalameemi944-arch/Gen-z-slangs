<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDE8FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Slang Book">
<meta name="description" content="The Gen Z & Gen Alpha Slang Book — 500+ words, phrases and internet expressions in an interactive flip book.">
<title>The Gen Z &amp; Gen Alpha Slang Book</title>
<link rel="apple-touch-icon" id="ati" href="">
<link rel="icon" id="fav" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@600;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDE8FF; --paper:#FFFFFF; --paper2:#FBF9FF; --ink:#1B1530; --mute:#6A6285; --line:#DDD5F3;
  --pink:#FF5FA2; --blue:#3D5AFE; --hi:#FFE45C; --mint:#3BE0A8; --warn:#FF7A45;
  --z:1; --r:18px;
  --disp:'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --hand:'Caveat', 'Comic Sans MS', 'Marker Felt', cursive;
  --ar:'Tajawal', 'Geeza Pro', 'Segoe UI', Tahoma, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#140F24; --paper:#211A38; --paper2:#1B1530; --ink:#F3EFFF; --mute:#A89FC6; --line:#342B55; --hi:#6B5B00; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#140F24; --paper:#211A38; --paper2:#1B1530; --ink:#F3EFFF; --mute:#A89FC6; --line:#342B55; --hi:#6B5B00; color-scheme:dark; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--disp);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.ar{font-family:var(--ar);direction:rtl}
.hand{font-family:var(--hand)}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.logo .blob{width:34px;height:34px;border-radius:11px;background:var(--pink);display:grid;place-items:center;transform:rotate(-6deg);font-size:18px;box-shadow:3px 3px 0 var(--ink)}
.topR{display:flex;gap:6px}
.ib{width:42px;height:42px;border-radius:14px;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-size:18px}
main{max-width:1100px;margin:0 auto;padding:6px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:2px solid var(--line)}
.bnav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:14px;font-size:12px;font-weight:600;color:var(--mute)}
.bnav button b{font-size:21px;line-height:1.1}
.bnav button.on{background:var(--ink);color:var(--paper)}

/* generic */
h1,h2,h3{letter-spacing:-.03em;line-height:1.05;margin:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(26px,5vw,38px);font-weight:800}
.sec-h .ar{color:var(--mute);font-size:17px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:700}
.btn.alt{background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn.wide{width:100%;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper2);border:2px solid var(--line);font-size:14px;font-weight:600;line-height:1.2}
button.chip:hover{border-color:var(--ink)}
.chip.link{border-color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-weight:600;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{padding:28px 16px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:var(--r)}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mini{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;padding:12px 14px;border-radius:16px;background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--cc)}
.mini .mt{font-weight:800;font-size:18px}
.mini .mm{grid-column:1/-1;color:var(--mute);font-size:14px;line-height:1.35}
.mini .mlv{grid-row:1;grid-column:2}
mark{background:var(--hi);color:inherit;padding:0 3px;border-radius:4px}

/* home */
.hero{position:relative;padding:22px 4px 8px}
.hero h1{font-size:clamp(40px,10vw,92px);font-weight:800;letter-spacing:-.05em;line-height:.92}
.hero h1 .l2{display:block;-webkit-text-stroke:2px var(--ink);color:transparent}
.hero h1 .l3{display:inline-block;background:var(--pink);color:#fff;padding:2px 12px 6px;border-radius:14px;transform:rotate(-2deg);margin-top:6px}
.hero p{max-width:560px;color:var(--mute);margin:14px 0 0}
.hero .tape{position:absolute;right:6px;top:18px;font-family:var(--hand);font-size:24px;background:var(--hi);color:#1B1530;padding:2px 14px;transform:rotate(7deg);box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{font-size:12px;color:var(--mute);line-height:1.2;display:block}
.prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:99px}
.sotd{position:relative;margin-top:18px;background:var(--ink);color:var(--paper);border-radius:24px;padding:20px;overflow:hidden}
.sotd .lab{font-family:var(--hand);font-size:26px;color:var(--hi)}
.sotd h3{font-size:clamp(34px,8vw,56px);font-weight:800;margin:4px 0 6px}
.sotd p{margin:6px 0;opacity:.92}
.sotd .emo{position:absolute;right:14px;top:10px;font-size:64px;transform:rotate(10deg)}
.sotd .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sotd .chip{background:transparent;border-color:rgba(255,255,255,.3);color:inherit}
:root[data-theme="dark"] .sotd,.sotd{}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;min-height:96px;border-radius:20px;background:var(--paper);border:2px solid var(--line);text-align:left;font-weight:700;transition:transform .15s}
.tile b{font-size:28px}
.tile small{font-family:var(--ar);color:var(--mute);font-weight:500}
.tile:active{transform:scale(.97)}
.tile.big{background:var(--blue);color:#fff;border-color:var(--blue)}
.tile.big small{color:#dfe3ff}

/* book */
.bookbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.bookbar .sp{flex:1}
.pnum{font-weight:700;font-size:14px;color:var(--mute);min-width:84px;text-align:center}
.stage{perspective:2200px;display:flex;justify-content:center}
.book{position:relative;width:100%;max-width:620px;height:calc(100vh - 250px);height:calc(100dvh - 250px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:430px;transform-style:preserve-3d}
.book::before{content:"";position:absolute;inset:6px -6px -6px 6px;border-radius:6px 22px 22px 6px;background:var(--line);z-index:-1}
.page,.leaf{position:absolute;inset:0;background:var(--paper);border-radius:6px 22px 22px 6px;border:2px solid var(--line);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;font-size:calc(16px * var(--z))}
.page{box-shadow:inset 18px 0 22px -18px rgba(27,21,48,.35)}
.leaf{transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;z-index:5;box-shadow:inset 18px 0 22px -18px rgba(27,21,48,.35)}
.leaf .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(27,21,48,.35));pointer-events:none;opacity:0}
.corner{position:absolute;bottom:0;width:64px;height:64px;z-index:6}
.corner.r{right:0;background:linear-gradient(135deg,transparent 50%,var(--line) 50%);border-radius:0 0 20px 0}
.corner.l{left:0;background:linear-gradient(225deg,transparent 50%,var(--line) 50%);opacity:.7}
.corner.r:hover{background:linear-gradient(135deg,transparent 44%,var(--pink) 44%)}
.pg-inner{padding:26px 22px 40px;min-height:calc(100% - 40px);position:relative}
.pgno{text-align:center;color:var(--mute);font-size:13px;padding:0 0 70px;font-weight:600}
.ribbon{position:absolute;top:-2px;right:26px;font-size:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.bookfoot{display:flex;align-items:center;gap:10px;max-width:620px;margin:10px auto 0}
.bookfoot input{flex:1;accent-color:var(--pink)}

/* cover */
.cover{min-height:100%;display:flex;flex-direction:column;justify-content:center;position:relative;padding:10px 4px;overflow:hidden}
.pg-inner.cover{background:var(--ink);color:#fff;border-radius:4px 20px 20px 4px;min-height:100%}
.cover h1{font-size:clamp(46px,11vw,78px);font-weight:800;letter-spacing:-.05em;line-height:.9;position:relative;z-index:2}
.cover h1 .o{-webkit-text-stroke:2px #fff;color:transparent}
.cover h1 .p{display:inline-block;background:var(--pink);padding:0 10px 6px;border-radius:12px;transform:rotate(-3deg);margin-top:8px}
.cover .kick{font-family:var(--hand);font-size:26px;color:var(--hi)}
.cover .sub{font-size:20px;font-weight:600;margin:18px 0 4px}
.cover .ar{font-size:18px;opacity:.85}
.cover .cta{margin-top:26px;font-family:var(--hand);font-size:24px;color:var(--mint)}
.stk{position:absolute;padding:6px 12px;border-radius:12px;font-weight:800;font-size:15px;box-shadow:3px 3px 0 rgba(0,0,0,.35);z-index:1}
.s1{top:4%;right:4%;background:var(--hi);color:#1B1530;transform:rotate(8deg)}
.s2{bottom:18%;right:2%;background:var(--mint);color:#1B1530;transform:rotate(-7deg)}
.s3{top:36%;right:10%;background:var(--blue);color:#fff;font-size:30px;transform:rotate(-12deg)}
.s4{bottom:6%;left:52%;font-size:40px;box-shadow:none}
.s5{top:10%;left:2%;background:#fff;color:#1B1530;transform:rotate(-8deg);font-family:var(--hand);font-size:22px}

/* toc */
.toc h2,.secp h2{font-size:clamp(34px,8vw,50px);font-weight:800}
.toc .row{display:flex;align-items:baseline;gap:8px;width:100%;padding:9px 2px;text-align:left;font-weight:600;font-size:1em}
.toc .row i{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.toc .row b{font-variant-numeric:tabular-nums}
.toc .row:hover span{color:var(--pink)}
.secp{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.pg-inner.sec{background:var(--cc);color:#fff;border-radius:4px 20px 20px 4px}
.secp .big{font-size:96px;line-height:1}
.secp h2{font-size:clamp(40px,10vw,64px)}
.secp .ar{font-size:24px;margin:6px 0 16px;opacity:.9}
.secp p{font-size:1.1em;max-width:420px}
.secp .note{font-family:var(--hand);font-size:26px;margin-top:20px;background:rgba(255,255,255,.2);padding:6px 14px;border-radius:12px;align-self:flex-start;transform:rotate(-2deg)}

/* entry */
.ent{position:relative}
.ent-top{display:flex;flex-wrap:wrap;gap:6px;padding-right:70px}
.ent-top .chip{font-size:13px;padding:4px 10px}
.ent-top .chip.cat{background:var(--cc);color:#fff;border-color:var(--cc)}
.sticker{position:absolute;top:-6px;right:0;font-size:52px;transform:rotate(9deg);filter:drop-shadow(2px 3px 0 rgba(0,0,0,.12))}
.term{font-size:clamp(2.2em,9vw,3.4em);font-weight:800;letter-spacing:-.04em;margin:14px 0 2px;word-break:break-word}
.term-ar{font-family:var(--ar);font-size:1.15em;color:var(--mute);margin-bottom:10px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.acts button{padding:8px 11px;border-radius:12px;border:2px solid var(--line);background:var(--paper2);font-size:14px;font-weight:600}
.acts button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.lab{font-family:var(--hand);font-size:1.55em;font-weight:700;color:var(--cc,var(--pink));margin:16px 0 0;line-height:1.1}
.lab .ar{font-size:.6em;color:var(--mute);margin-inline-start:8px}
.ent p{margin:4px 0}
.meaning{font-size:1.2em;font-weight:600;line-height:1.4}
.ex{position:relative;margin:6px 0;padding:12px 14px;background:var(--paper2);border-radius:14px;border:2px solid var(--line);font-size:1.08em}
.ex .sayb{float:right;margin-left:8px}
.sayb{width:36px;height:36px;border-radius:12px;background:var(--paper);border:2px solid var(--line);display:inline-grid;place-items:center;font-size:15px;vertical-align:middle}
.chat{display:flex;flex-direction:column;gap:6px;margin:8px 0;padding:12px;background:var(--paper2);border-radius:18px;border:2px solid var(--line)}
.bub{max-width:82%;padding:8px 12px;border-radius:18px;font-size:.98em;line-height:1.35}
.bub.them{align-self:flex-start;background:var(--line);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fact{background:var(--paper2);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.fact small{display:block;color:var(--mute);font-size:.78em;font-weight:600}
.fact b{font-size:.95em}
.origin{margin-top:8px;padding:12px 14px;background:var(--hi);color:#1B1530;border-radius:4px 14px 14px 14px;transform:rotate(-.6deg);font-size:.98em;box-shadow:3px 3px 0 rgba(0,0,0,.08)}
:root[data-theme="dark"] .origin{color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .origin{color:#fff} }
.warnnote{margin-top:10px;padding:10px 12px;border-radius:12px;border:2px dashed var(--warn);font-size:.95em}
.colbox,.notebox{margin:8px 0;padding:10px;border-radius:14px;background:var(--paper2);border:2px solid var(--line)}
.colbox .row{display:flex;gap:6px;margin-top:8px}
.colbox input,.notebox textarea{flex:1;width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--paper)}
.notebox textarea{min-height:80px;resize:vertical}

/* talk pages */
.talk h2{font-size:clamp(32px,8vw,48px);font-weight:800}
.tl{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:2px dashed var(--line)}
.tl span{flex:1;font-size:1.1em;font-weight:600}
.tl .n{flex:0;min-width:34px;font-family:var(--hand);font-size:1.4em;color:var(--pink)}

/* search */
.sbox{position:relative;margin-top:6px}
.sbox input{width:100%;padding:16px 18px 16px 50px;border-radius:20px;border:3px solid var(--ink);background:var(--paper);font-size:18px;font-weight:600}
.sbox .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px}
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--paper);border:2px solid var(--ink);border-radius:18px;z-index:10;overflow:hidden;box-shadow:0 14px 30px rgba(27,21,48,.18)}
.ac button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line)}
.ac button small{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.hint{color:var(--mute);font-size:14px;margin:12px 2px 8px}
.big-ans{margin-top:14px}
.big-ans .card{border-color:var(--ink)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,15,36,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:26px;max-height:88vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.x{position:sticky;top:0;float:right;z-index:3;width:40px;height:40px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* flashcards */
.fcwrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:14px}
.fc{width:min(100%,420px);height:340px;perspective:1400px;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .3s}
.fc-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.1,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:3px solid var(--ink)}
.fc .front{background:var(--paper)}
.fc .back{background:var(--ink);color:var(--paper);transform:rotateY(180deg)}
.fc .front h3{font-size:clamp(34px,9vw,48px);font-weight:800;margin:8px 0}
.fc .q{color:var(--mute);font-weight:600}
.fc .tap{position:absolute;bottom:14px;font-family:var(--hand);font-size:20px;color:var(--mute)}
.fc .back p{font-size:19px;margin:6px 0}
.fc .back .ar{opacity:.85}
.fc[data-hint="know"] .face{border-color:var(--mint);box-shadow:0 0 0 4px var(--mint)}
.fc[data-hint="learn"] .face{border-color:var(--warn);box-shadow:0 0 0 4px var(--warn)}
.fcbtns{display:flex;gap:10px;width:min(100%,420px)}
.fcbtns .btn{flex:1}

/* quiz */
.qmodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.qm{padding:16px;border-radius:20px;background:var(--paper);border:2px solid var(--line);text-align:left}
.qm b{display:block;font-size:18px}
.qm small{color:var(--mute)}
.qm.daily{background:var(--pink);color:#fff;border-color:var(--pink)}
.qm.daily small{color:#ffe0ee}
.qbox{max-width:640px;margin:10px auto}
.qtop{display:flex;justify-content:space-between;color:var(--mute);font-weight:600;font-size:14px}
.qq{font-size:clamp(22px,5vw,30px);font-weight:800;margin:14px 0;line-height:1.2}
.qq .emo{font-size:72px;display:block;margin:8px 0}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:16px;background:var(--paper);border:2px solid var(--line);font-weight:600;font-size:16px}
.opt.good{background:var(--mint);border-color:var(--mint);color:#10231b}
.opt.bad{background:var(--warn);border-color:var(--warn);color:#fff}
.exp{margin-top:10px;padding:14px;border-radius:16px;background:var(--paper2);border:2px solid var(--line)}
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
.match button{padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-weight:600;text-align:left;min-height:56px;font-size:14px}
.match .l{font-weight:800;font-size:17px}
.match button.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue)}
.match button.ok{background:var(--mint);border-color:var(--mint);color:#10231b;opacity:.75}
.match button.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* translator / say */
.panel{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px;margin-top:12px}
.panel textarea{width:100%;min-height:92px;padding:12px 14px;border-radius:16px;border:2px solid var(--ink);background:var(--paper2);resize:vertical}
.sug{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:6px 0;border-radius:14px;background:var(--paper2);border:2px solid var(--line)}
.sug span{flex:1;font-weight:700;font-size:17px}
.brk{display:flex;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line)}
.brk b{min-width:90px}

/* categories */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cg{padding:14px;border-radius:20px;color:#fff;background:var(--cc);text-align:left;min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.cg b{font-size:30px}
.cg span{font-weight:800;font-size:16px;line-height:1.15}
.cg small{font-family:var(--ar);opacity:.9}
.cg.on{outline:4px solid var(--ink);outline-offset:2px}

.trend-badge{display:inline-block;padding:3px 9px;border-radius:8px;background:var(--pink);color:#fff;font-size:12px;font-weight:800;letter-spacing:.02em}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}
.switch{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--mint)}.switch.on::after{left:25px}

@media (max-width:520px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .pg-inner{padding:22px 16px 40px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .sticker{font-size:42px}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

 for(const e of cands){let idx;
  if(e.term.length===1){const m=text.match(new RegExp('(^|[\\s!?.,])'+e.term+'($|[\\s!?.,])'));if(!m)continue;idx=m.index+1+m[1].length}
  else{const t=e.tl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const pict=/\p{Extended_Pictographic}/u.test(e.tl);const re=pict?new RegExp(t,'u'):new RegExp("(?<![\\p{L}\\p{N}'])"+t+"(?![\\p{L}\\p{N}])",'u');const m=low.match(re);if(!m)continue;idx=m.index;

  const end=idx+e.tl.length;if(taken.some(([a,b])=>idx<b&&end>a))continue;taken.push([idx,end]);found.push(e)}

function bindCard(){const el=$('#fc');if(!el)return;let sx=0,dx=0,drag=false,moved=false;

 el.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;if(Math.abs(dx)>6)moved=true;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;el.dataset.hint=dx>60?'know':dx<-60?'learn':''});
 const end=()=>{if(!drag)return;drag=false;el.style.transition='';el.dataset.hint='';if(dx>100)fcAnswer(true);else if(dx<-100)fcAnswer(false);else{el.style.transform='';if(!moved)el.classList.toggle('flipped')}};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function fcAnswer(k){const id=FC.deck[FC.i];if(!id)return;const el=$('#fc');
 if(k){if(!has('known',id))S.known.push(id);S.later=S.later.filter(x=>x!==id)}else{if(!has('later',id))S.later.push(id);S.known=S.known.filter(x=>x!==id);const wf=S.cols['Words I Keep Forgetting'];if(wf&&!wf.includes(id))wf.push(id)}
 save();ding(k);if(el){el.style.transform=`translateX(${k?600:-600}px) rotate(${k?25:-25}deg)`;el.style.opacity='0'}setTimeout(()=>{FC.i++;R.cards()},250)}

const QMODES=[['daily','📅 Daily 5-question challenge','تحدي اليوم'],['mc','🅰️ Multiple choice','اختيار من متعدد'],['guess','🤔 Guess the slang','خمّن الكلمة'],['complete','✏️ Complete the sentence','كمّل الجملة'],['match','🔗 Match slang to meaning','وصّل'],['gen','🧃 Gen Z vs Gen Alpha','زد ولا ألفا؟'],['emoji','😀 Emoji → slang','إيموجي'],['normal','🗣️ Slang → normal English','ترجمها']];
const EMOJIQ=[['💀',"I'm dead"],['🧢','cap'],['🐐','GOAT'],['🔥','fire'],['🤡','clown'],['🚩','red flag'],['💅','slay'],['☕','tea'],['🤌',"chef's kiss"],['📸','caught in 4K'],['🌱','touch grass'],['🍳','let him cook'],['🥶','cold'],['👑','mother'],['🗣️','yap'],['🍟','fanum tax'],['🧠','brainrot'],['✨',"it's giving"],['😭',"I'm crying"],['🫠','in my feels']];
let QZ=null;
function qPool(){return DB.filter(e=>e.full)}
function makeQ(mode,r){const pool=qPool();const others=(e,n,f)=>shuffle(pool.filter(x=>x.id!==e.id&&f(x)!==f(e)),r).slice(0,n);
 for(let tries=0;tries<30;tries++){const e=pick(pool,r);
  if(mode==='mc'){const o=shuffle([e,...others(e,3,gloss)],r);return{q:`What does “${e.term}” mean?`,opts:o.map(gloss),ans:o.indexOf(e),e}}
  if(mode==='guess'){const o=shuffle([e,...others(e,3,x=>x.tl)],r);return{q:`Which slang means: “${gloss(e)}”?`,opts:o.map(x=>x.term),ans:o.indexOf(e),e}}
  if(mode==='complete'){if(e.term.length<2||!e.ex.toLowerCase().includes(e.tl))continue;const blank=e.ex.replace(new RegExp(e.tl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'_____');const o=shuffle([e,...others(e,3,x=>x.tl)],r);return{q:`Complete the sentence: “${blank}”`,opts:o.map(x=>x.term),ans:o.indexOf(e),e}}
  if(mode==='gen'){const g=pool.filter(x=>x.gen==='z'||x.gen==='a');const x=pick(g,r);return{q:`Is “${x.term}” mostly Gen Z or Gen Alpha slang?`,opts:['Gen Z','Gen Alpha'],ans:x.gen==='z'?0:1,e:x,note:'Both generations share a lot of slang — this is about where it’s most associated.'}}
  if(mode==='emoji'){const valid=EMOJIQ.filter(p=>findTerm(p[1]));const p=pick(valid,r);const x=findTerm(p[1]);const o=shuffle([x,...shuffle(valid.filter(v=>v[1]!==p[1]),r).slice(0,3).map(v=>findTerm(v[1]))],r);return{q:`Which slang goes with this emoji?`,emoji:p[0],opts:o.map(y=>y.term),ans:o.indexOf(x),e:x}}
  if(mode==='normal'){const o=shuffle([e,...others(e,3,gloss)],r);return{q:`“${e.ex}” — in normal English, “${e.term}” means…`,opts:o.map(gloss),ans:o.indexOf(e),e}}}
 return makeQ('mc',r)}
function startQuiz(mode){if(mode==='match'){startMatch();return}const daily=mode==='daily';const r=daily?seeded(hash('q'+TODAY)):Math.random;const n=daily?5:10;const mix=['mc','guess','complete','emoji','normal'];
 QZ={mode,i:0,n,score:0,qs:[],ans:null};for(let i=0;i<n;i++)QZ.qs.push(makeQ(daily?mix[i%5]:mode,r));R.quiz()}
R.quiz=()=>{const v=$('#v-quiz');if(!QZ){const acc=S.q.total?Math.round(S.q.correct/S.q.total*100):0;const diff=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>BYID[x[0]]).filter(Boolean);
  v.innerHTML=`<div class="sec-h"><h2>Quiz mode</h2><span class="ar">اختبر نفسك</span></div>
  <div class="stats"><div class="stat"><b>${S.q.correct}</b><span>Correct answers</span></div><div class="stat"><b>${acc}%</b><span>Accuracy</span></div><div class="stat"><b>⚡ ${S.q.streak}</b><span>Answer streak (best ${S.q.best})</span></div><div class="stat"><b>${S.known.length}</b><span>Words learned</span></div></div>
  <div class="qmodes" style="margin-top:14px">${QMODES.map(m=>`<button class="qm ${m[0]==='daily'?'daily':''}" data-act="qstart" data-m="${m[0]}"><b>${m[1]}</b><small class="ar">${m[2]}</small>${m[0]==='daily'&&S.dailyDone===TODAY?'<br><small>✅ done today — play again for practice</small>':''}</button>`).join('')}</div>
  <div class="sec-h"><h2 style="font-size:24px">Difficult words</h2><span class="ar">كلمات صعبة عليك</span></div>${diff.length?`<div class="list">${diff.map(mini).join('')}</div>`:'<div class="empty">Words you miss in quizzes show up here. · الكلمات اللي تغلط فيها بتطلع هني</div>'}`;return}
 if(QZ.mode==='match'){renderMatch();return}
 if(QZ.i>=QZ.n){const pct=Math.round(QZ.score/QZ.n*100);if(QZ.mode==='daily'){S.dailyDone=TODAY;save()}
  v.innerHTML=`<div class="qbox"><div class="card" style="text-align:center"><div style="font-size:64px">${pct>=80?'🏆':pct>=50?'🔥':'📚'}</div><h2 style="font-size:34px">${QZ.score} / ${QZ.n}</h2><p>${pct>=80?'You ate. No crumbs.':pct>=50?'Solid — lock in a bit more.':'Lowkey cooked, but that’s how you learn.'}</p><p class="ar">${pct>=80?'كفو عليك!':pct>=50?'زين، كمّل':'عادي، بتتعلم'}</p><div class="chips" style="justify-content:center"><button class="btn" data-act="qstart" data-m="${QZ.mode}">Play again</button><button class="btn alt" data-act="qmenu">All modes</button></div></div></div>`;return}
 const q=QZ.qs[QZ.i],a=QZ.ans;
 v.innerHTML=`<div class="qbox"><div class="qtop"><button data-act="qmenu">← Modes</button><span>Question ${QZ.i+1} / ${QZ.n} · Score ${QZ.score}</span></div>
 <div class="qq">${q.emoji?`<span class="emo">${q.emoji}</span>`:''}${esc(q.q)}</div>
 ${q.opts.map((o,i)=>`<button class="opt ${a!=null?(i===q.ans?'good':i===a?'bad':''):''}" data-act="qa" data-i="${i}" ${a!=null?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}
 ${a!=null?`<div class="exp"><b>${a===q.ans?'✅ Correct! · صح':'❌ Not quite · غلط'}</b><p><b>${esc(q.e.term)}</b> — ${esc(q.e.meaning)}</p><p>“${esc(q.e.ex)}”</p><p class="ar">${esc(q.e.ar)}</p>${q.note?`<p class="hint">${esc(q.note)}</p>`:''}<div class="chips"><button class="btn" data-act="qnext">Next →</button><button class="btn alt" data-act="open" data-id="${q.e.id}">Open card</button></div></div>`:''}</div>`};
function answer(i){const q=QZ.qs[QZ.i];if(QZ.ans!=null)return;QZ.ans=i;const ok=i===q.ans;S.q.total++;
 if(ok){QZ.score++;S.q.correct++;S.q.streak++;S.q.best=Math.max(S.q.best,S.q.streak);S.right[q.e.id]=(S.right[q.e.id]||0)+1;if((S.right[q.e.id]||0)>=2&&!has('known',q.e.id))S.known.push(q.e.id)}
 else{S.q.streak=0;S.wrong[q.e.id]=(S.wrong[q.e.id]||0)+1}save();ding(ok);R.quiz()}
function startMatch(){const set=shuffle(qPool()).filter((e,i,a)=>a.findIndex(x=>gloss(x)===gloss(e))===i).slice(0,4);QZ={mode:'match',set,right:shuffle(set),sel:null,done:[],miss:0};R.quiz()}
function renderMatch(){const v=$('#v-quiz'),M=QZ;const fin=M.done.length===4;
 v.innerHTML=`<div class="qbox"><div class="qtop"><button data-act="qmenu">← Modes</button><span>Tap a word, then its meaning · وصّل الكلمة بمعناها</span></div><div class="qq">Match slang ↔ meaning</div>
 <div class="match">${[0,1,2,3].map(i=>{const L=M.set[i],Rr=M.right[i];return `<button class="l ${M.done.includes(L.id)?'ok':''} ${M.sel===L.id?'sel':''}" data-act="ml" data-id="${L.id}" ${M.done.includes(L.id)?'disabled':''}>${esc(L.term)}</button><button class="${M.done.includes(Rr.id)?'ok':''}" data-act="mr" data-id="${Rr.id}" ${M.done.includes(Rr.id)?'disabled':''}>${esc(gloss(Rr))}</button>`}).join('')}</div>
 ${fin?`<div class="exp"><b>🎉 All matched${M.miss?` with ${M.miss} miss${M.miss>1?'es':''}`:' — perfect!'}</b><div class="chips" style="margin-top:8px"><button class="btn" data-act="qstart" data-m="match">Next set</button><button class="btn alt" data-act="qmenu">All modes</button></div></div>`:''}</div>`}
function matchPick(side,id,btn){const M=QZ;if(side==='l'){M.sel=id;renderMatch();return}if(!M.sel){toast('Pick a slang word first');return}
 S.q.total++;if(M.sel===id){M.done.push(id);S.q.correct++;S.q.streak++;S.q.best=Math.max(S.q.best,S.q.streak);ding(true);M.sel=null}else{M.miss++;S.q.streak=0;S.wrong[M.sel]=(S.wrong[M.sel]||0)+1;ding(false);btn.classList.add('no');setTimeout(()=>btn.classList.remove('no'),400);save();return}save();renderMatch()}

 case 'savex':{const s=b.dataset.say,i=S.saved.indexOf(s);if(i<0){S.saved.push(s);toast('Sentence saved ⭐')}else{S.saved.splice(i,1);toast('Removed')}save();if(curView==='book')renderPage();else if(curView==='favs')R.favs();break}
 case 'col':{const box=b.closest('.ent').querySelector('.colbox');box.classList.toggle('hidden');box.innerHTML=`<b>Add to collection · ضيفها لمجموعة</b><div class="chips" style="margin-top:8px">${Object.keys(S.cols).map(n=>`<button class="chip ${S.cols[n].includes(id)?'link':''}" data-act="colt" data-id="${id}" data-col="${esc(n)}">${S.cols[n].includes(id)?'✓ ':''}${esc(n)}</button>`).join('')}</div><div class="row"><input placeholder="New collection" aria-label="New collection name"><button class="btn" data-act="coladd" data-id="${id}">Add</button></div>`;break}
 case 'colt':{const c=S.cols[b.dataset.col];const i=c.indexOf(id);i<0?c.push(id):c.splice(i,1);save();b.classList.toggle('link',i<0);b.textContent=(i<0?'✓ ':'')+b.dataset.col;break}
 case 'coladd':{const inp=b.parentNode.querySelector('input');const n=inp.value.trim();if(!n)return;S.cols[n]=S.cols[n]||[];if(!S.cols[n].includes(id))S.cols[n].push(id);save();toast('Added to “'+n+'” 📁');b.closest('.ent').querySelector('[data-act="col"]').click();b.closest('.ent')&&null;break}
 case 'note':{const box=b.closest('.ent').querySelector('.notebox');box.classList.toggle('hidden');if(!box.classList.contains('hidden'))box.querySelector('textarea').focus();break}
 case 'another':{const pool=DB.filter(e=>e.full);const e=pick(pool);DAILYX=e.id;const card=b.closest('.sotd');card.outerHTML=dailyCard(e,'Bonus word');if(curView==='daily')R.daily();break}
 case 'q':{if(curView!=='search')show('search');$('#q').value=b.dataset.q;$('#ac').classList.add('hidden');runSearch(b.dataset.q);break}
 case 'sit':showSit([SITS[+b.dataset.i]]);break;
 case 'sayrun':runSay($('#sayin').value);break;
 case 'tmode':setTMode(b.dataset.m);break;case 'tfill':$('#tin').value=b.dataset.q;runTrans();break;case 'trun':runTrans();break;
 case 'deck':buildDeck(b.dataset.k);R.cards();break;case 'fcans':fcAnswer(b.dataset.k==='1');break;
 case 'qstart':startQuiz(b.dataset.m);break;case 'qmenu':QZ=null;R.quiz();break;case 'qa':answer(+b.dataset.i);break;case 'qnext':QZ.i++;QZ.ans=null;R.quiz();window.scrollTo(0,0);break;
 case 'ml':matchPick('l',id,b);break;case 'mr':matchPick('r',id,b);break;
 case 'ftab':FTAB=b.dataset.t;R.favs();break;
 case 'mkcol':{const n=$('#newcol').value.trim();if(!n)return;if(!S.cols[n])S.cols[n]=[];save();R.favs();toast('Collection created 📁');break}
 case 'delcol':if(confirm('Delete “'+b.dataset.col+'”?')){delete S.cols[b.dataset.col];save();R.favs()}break;
 case 'catsel':showCat(b.dataset.c);break;
 case 'sfx':S.sfx=!S.sfx;save();applyTheme();toast(S.sfx?'Sounds on 🔊':'Sounds muted 🔇');break;
 case 'theme':{const dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;S.theme=dark?'light':'dark';save();applyTheme();break}
 case 'settings':openSheet(settingsHTML());bindRate();break;
 case 'settheme':S.theme=b.dataset.t;save();applyTheme();$('#mbody').innerHTML=settingsHTML();bindRate();break;
 case 'set':S[b.dataset.k]=!S[b.dataset.k];save();applyTheme();b.classList.toggle('on',S[b.dataset.k]);if(b.dataset.k==='voice'&&!S.voice&&'speechSynthesis' in window)speechSynthesis.cancel();break;
 case 'reset':if(confirm('Reset all progress, favorites, notes and collections?')){localStorage.removeItem(KEY);location.reload()}break;
 }});
function bindRate(){const r=$('#rate');if(r)r.oninput=()=>{S.rate=+r.value;save()}}
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset&&t.dataset.note){S.notes[t.dataset.note]=t.value;save()}});
$('#modal').addEventListener('click',ev=>{if(ev.target.id==='modal')closeModal()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal();if(curView==='book'&&$('#modal').classList.contains('hidden')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){if(ev.key==='ArrowRight')flip(cur+1);if(ev.key==='ArrowLeft')flip(cur-1)}});
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

/* ========== home-screen icon ========== */
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#1B1530';x.fillRect(0,0,180,180);x.fillStyle='#FF5FA2';x.beginPath();x.roundRect?x.roundRect(22,30,136,120,26):x.rect(22,30,136,120);x.fill();x.fillStyle='#FFE45C';x.font='bold 30px system-ui';x.textAlign='center';x.fillText('GEN Z',90,78);x.fillStyle='#fff';x.font='bold 44px system-ui';x.fillText('SLANG',90,126);const u=c.toDataURL('image/png');$('#ati').href=u;$('#fav').href=u}catch(e){}})();

applyTheme();document.documentElement.style.setProperty('--z',S.zoom);show('home');
</script>
</body>
